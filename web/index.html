<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/admin-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f5" />
    <!-- Instalar como app (13/10/2026, TeamBack Affiliates): manifest + ícono para iOS. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Poker Gestión" />
    <script>
      // Dos apps instalables en el mismo sitio (21/10/2026, pedido de Leo): TeamBack Affiliates (/teamback) usa el manifest de arriba;
      // todo lo demás (panel de administración y portales) usa el de Poker Gestión, con su propio ícono. Se decide acá, antes de que el navegador evalúe la instalación.
      if (location.pathname.indexOf("/teamback") !== 0) {
        document.querySelector("link[rel=manifest]").href = "/manifest-admin.json";
        document.querySelector("link[rel=apple-touch-icon]").href = "/admin-apple-touch-icon.png";
      } else {
        document.querySelector("link[rel=icon]").href = "/icon-192.png";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Poker Gestión</title>
  </head>
  <body>
    <script>
      // Setea el tema ANTES de que React pinte nada, así no hay un flash del tema por defecto
      // (claro, pedido de Leo: "por defecto quede todos los sistemas en blanco y despues
      // optar por el modo noche") al entrar en modo noche — mismo localStorage que usa el
      // toggle en Shell.tsx. Sin nada guardado todavia, queda en claro.
      try {
        var t = localStorage.getItem("dp_theme");
        if (t !== "dark") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
