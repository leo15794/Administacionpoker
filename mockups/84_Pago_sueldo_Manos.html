<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>document.documentElement.dataset.theme = location.hash === "#dia" ? "light" : "dark";</script>
<style>
  :root { --bg:#0d1117; --text:#e6edf3; --dim:#9da7b3; --faint:#808a96; --accent:#4493f8; --accent-rgb:68,147,248; --accent-grad:linear-gradient(135deg,#5aa2ff,#2f7de0); --accent-ink:#06101f;
    --green:#3fb950; --green-soft:rgba(63,185,80,.14); --red:#f85149;
    --glow1:rgba(68,147,248,.28); --glow2:rgba(63,185,80,.14); --modal:#121a26; --border:rgba(255,255,255,.10); --input:#0d131c; --chip:rgba(255,255,255,.06); --sel:rgba(68,147,248,.14); }
  :root[data-theme="light"] { --bg:#f4f7f5; --text:#14201a; --dim:#55655c; --faint:#7c887f; --accent:#157a57; --accent-rgb:21,122,87; --accent-grad:linear-gradient(135deg,#1e9a6e,#146b4c); --accent-ink:#fff;
    --green:#157a57; --green-soft:rgba(21,122,87,.10); --red:#c23744;
    --glow1:rgba(45,190,133,.28); --glow2:rgba(138,106,50,.12); --modal:#ffffff; --border:rgba(11,24,18,.10); --input:#f7faf8; --chip:rgba(11,24,18,.05); --sel:rgba(21,122,87,.10); }
  * { box-sizing:border-box; margin:0; }
  body { width:1500px; font-family:Inter,system-ui,sans-serif; color:var(--text); font-variant-numeric:tabular-nums;
    background: radial-gradient(800px 560px at 10% 0%,var(--glow1),transparent 62%), radial-gradient(760px 620px at 95% 100%,var(--glow2),transparent 60%), var(--bg); padding:28px; min-height:1260px; }
  h1 { font-size:22px; font-weight:800; letter-spacing:-.02em; } .sub { color:var(--dim); font-size:13.5px; margin:4px 0 22px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .cap { font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--faint); margin:0 0 8px 4px; text-transform:uppercase; }
  .modal { background:var(--modal); border:1px solid var(--border); border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,.30); }
  .mh { display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--border); font-weight:700; font-size:16px; }
  .mh span { color:var(--dim); font-weight:400; font-size:18px; }
  .mb { padding:18px 22px 22px; }
  .lbl { font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; margin-bottom:7px; }
  .medios { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
  .medio { border:1px solid var(--border); background:var(--chip); border-radius:13px; padding:10px 10px 9px; }
  .medio .ic { width:26px; height:26px; border-radius:8px; display:grid; place-items:center; font-size:13px; font-weight:800; background:var(--chip); color:var(--dim); margin-bottom:7px; }
  .medio b { display:block; font-size:12.5px; } .medio small { display:block; color:var(--faint); font-size:11px; margin-top:2px; line-height:1.3; }
  .medio.on { border-color:var(--accent); background:var(--sel); box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15); }
  .medio.on .ic { background:var(--accent-grad); color:var(--accent-ink); }
  .nota { font-size:13px; color:var(--dim); line-height:1.5; margin-bottom:14px; min-height:39px; } .nota b { color:var(--text); }
  .row { display:grid; gap:12px; margin-bottom:12px; } .c3 { grid-template-columns:1fr 1fr 1fr; } .c2 { grid-template-columns:1fr 1fr; }
  .in { height:42px; border:1px solid var(--border); background:var(--input); border-radius:11px; padding:0 13px; display:flex; align-items:center; font-size:14px; }
  .in .u { margin-left:auto; color:var(--faint); font-size:12px; font-weight:600; }
  .chk { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--border); border-radius:12px; padding:11px 13px; margin:4px 0 12px; font-size:13.5px; }
  .box { width:18px; height:18px; border-radius:5px; border:1.5px solid var(--faint); flex:none; margin-top:1px; display:grid; place-items:center; font-size:12px; font-weight:800; }
  .box.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .chk small { display:block; color:var(--dim); font-size:12px; margin-top:3px; } .chk small b { color:var(--text); }
  .saldo { display:flex; align-items:center; gap:12px; border-radius:12px; padding:11px 14px; background:var(--chip); margin-bottom:12px; font-size:13px; }
  .saldo .k { color:var(--dim); } .saldo .v { font-weight:700; font-size:15px; } .saldo .ar { color:var(--faint); }
  .ok { background:var(--green-soft); color:var(--green); border-radius:11px; padding:10px 13px; font-size:13px; font-weight:600; margin-bottom:12px; }
  .btn { display:inline-flex; height:42px; align-items:center; padding:0 20px; border-radius:12px; background:var(--accent-grad); color:var(--accent-ink); font-weight:700; font-size:14px; box-shadow:0 8px 20px rgba(var(--accent-rgb),.3); }
</style></head><body>
<h1>Pago del sueldo de Manos · elegir cómo se paga</h1>
<div class="sub">Arriba se elige el medio y abajo cambian los campos. Los saldos de las cuentas socio son de ejemplo.</div>
<div class="grid" id="g"></div>
<script>
const medios = [
  ["$", "Pesos", "Juan paga en ARS"],
  ["₮", "USDT", "Sale de Wallet"],
  ["M", "Cuenta Manos", "Se descuenta ahí"],
  ["J", "Cuenta Juan", "Se descuenta ahí"],
];
const sel = (i) => `<div class="lbl">¿Cómo se paga?</div><div class="medios">${medios.map((m, j) => `<div class="medio ${i===j?"on":""}"><div class="ic">${m[0]}</div><b>${m[1]}</b><small>${m[2]}</small></div>`).join("")}</div>`;
const fecha = `<div><div class="lbl">Fecha de pago</div><div class="in">10/11/2026</div></div>`;
const obs = `<div class="row"><div><div class="lbl">Observaciones (opcional)</div><div class="in"></div></div></div>`;
const monto = `<div><div class="lbl">Monto (USDT)</div><div class="in">452,00<span class="u">USDT</span></div></div>`;
const wallet = (on, txt) => `<div class="chk"><div class="box ${on?"on":""}">${on?"✓":""}</div><div>Esto también mueve la Wallet (USDT real)<small>${txt}</small></div></div>`;
const cuerpos = [
  `<div class="nota">Juan lo paga en pesos: al quedar pagado se le baja la deuda por <b>US$ 452</b>. No mueve Wallet Manos ni las cuentas socio.</div>
   <div class="row c3">${fecha}<div><div class="lbl">Pesos pagados (ARS)</div><div class="in">651.784<span class="u">ARS</span></div></div><div><div class="lbl">Cotización ARS/USDT</div><div class="in">1.442</div></div></div>
   <div class="ok">Equivalente US$ 452 · esperado US$ 452 ✓</div>${obs}`,
  `<div class="nota">Se le paga a Manos en USDT. Con el tilde de abajo queda registrado el <b>egreso real</b> en Wallet, como en el resto del panel.</div>
   <div class="row c2">${fecha}${monto}</div>
   ${wallet(true, "Al guardar se va a registrar en Wallet un <b>EGRESO</b> real de <b>US$ 452</b>.")}${obs}`,
  `<div class="nota">Se descuenta de la <b>cuenta socio de Manos</b> como movimiento “Sueldo Manos · Octubre 2026”.</div>
   <div class="row c2">${fecha}${monto}</div>
   <div class="saldo"><span class="k">Saldo cuenta Manos</span><span class="v">US$ 1.250</span><span class="ar">→</span><span class="v">US$ 798</span></div>
   ${wallet(false, "Tildalo solo si esta plata de verdad salió de la Wallet.")}${obs}`,
  `<div class="nota">Se descuenta de la <b>cuenta socio de Juan</b> como movimiento “Sueldo Manos · Octubre 2026”.</div>
   <div class="row c2">${fecha}${monto}</div>
   <div class="saldo"><span class="k">Saldo cuenta Juan</span><span class="v">US$ 3.400</span><span class="ar">→</span><span class="v">US$ 2.948</span></div>
   ${wallet(false, "Tildalo solo si esta plata de verdad salió de la Wallet.")}${obs}`,
];
const caps = ["1 · Pesos (como hoy)", "2 · USDT desde Wallet", "3 · Descontar de la cuenta socio de Manos", "4 · Descontar de la cuenta socio de Juan"];
document.getElementById("g").innerHTML = cuerpos.map((c, i) => `<div><div class="cap">${caps[i]}</div><div class="modal"><div class="mh">Pago del sueldo de Manos · Octubre 2026<span>✕</span></div><div class="mb">${sel(i)}${c}<div class="btn">Registrar pago</div></div></div></div>`).join("");
</script></body></html>
